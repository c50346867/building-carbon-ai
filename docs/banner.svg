<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#4ade80;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:0" />
    </linearGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow1)" opacity="0.5"/>
  <rect y="100" width="1200" height="100" fill="url(#glow2)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.03">
    <circle cx="100" cy="50" r="1.5" fill="#4ade80"/>
    <circle cx="300" cy="150" r="1" fill="#4ade80"/>
    <circle cx="500" cy="80" r="1.5" fill="#4ade80"/>
    <circle cx="700" cy="200" r="1" fill="#4ade80"/>
    <circle cx="900" cy="120" r="1.5" fill="#4ade80"/>
    <circle cx="1100" cy="60" r="1" fill="#4ade80"/>
    <circle cx="200" cy="250" r="1" fill="#4ade80"/>
    <circle cx="600" cy="30" r="1" fill="#4ade80"/>
    <circle cx="1000" cy="260" r="1" fill="#4ade80"/>
  </g>

  <!-- Decorative wave lines -->
  <path d="M0,250 Q150,230 300,250 T600,250 T900,250 T1200,250"
        fill="none" stroke="#4ade80" stroke-width="0.5" opacity="0.12"/>
  <path d="M0,260 Q150,245 300,260 T600,260 T900,260 T1200,260"
        fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.08"/>

  <!-- Leaf icon -->
  <g transform="translate(60, 60)" filter="url(#soft-glow)">
    <path d="M30,90 C-20,50 -10,0 30,10 C70,0 80,50 30,90Z"
          fill="none" stroke="#4ade80" stroke-width="2.5" opacity="0.8"/>
    <line x1="30" y1="10" x2="30" y2="85"
          stroke="#4ade80" stroke-width="1" opacity="0.4"/>
    <path d="M30,40 Q45,30 55,35" fill="none" stroke="#4ade80"
          stroke-width="1" opacity="0.4"/>
    <path d="M30,55 Q45,45 50,52" fill="none" stroke="#4ade80"
          stroke-width="1" opacity="0.4"/>
    <path d="M30,25 Q15,15 5,20" fill="none" stroke="#4ade80"
          stroke-width="1" opacity="0.35"/>
    <path d="M30,40 Q15,30 8,38" fill="none" stroke="#4ade80"
          stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Building icon -->
  <g transform="translate(80, 145)" opacity="0.15">
    <rect x="0" y="20" width="40" height="60" fill="#4ade80"/>
    <rect x="10" y="30" width="6" height="8" fill="#0a1628"/>
    <rect x="24" y="30" width="6" height="8" fill="#0a1628"/>
    <rect x="10" y="45" width="6" height="8" fill="#0a1628"/>
    <rect x="24" y="45" width="6" height="8" fill="#0a1628"/>
    <rect x="10" y="60" width="6" height="8" fill="#0a1628"/>
    <rect x="24" y="60" width="6" height="8" fill="#0a1628"/>
  </g>

  <!-- Title -->
  <text x="180" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="36"
        font-weight="700" fill="#4ade80" filter="url(#neon-glow)">
    Building Carbon Management AI
  </text>
  <text x="180" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="20"
        fill="#94a3b8" font-weight="400">
    AI 建筑碳管理平台
  </text>

  <!-- Subtitle -->
  <text x="180" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="13"
        fill="#64748b">
    碳排放计算 · 时序预测 · 减排路径优化 · 碳中和路线图
  </text>

  <!-- Key metrics -->
  <g transform="translate(180, 210)">
    <rect x="0" y="0" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">碳计算引擎</text>
    <text x="15" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#4ade80">Scope 1/2/3</text>
    <text x="100" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">GB/T 51366-2019</text>

    <rect x="215" y="0" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="230" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">机器学习预测</text>
    <text x="230" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#22d3ee">季节性分解</text>
    <text x="320" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">95% CI</text>

    <rect x="430" y="0" width="200" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="445" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8">减排优化</text>
    <text x="445" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#fbbf24">投资回报排序</text>
  </g>

  <!-- Tech stack badge -->
  <g transform="translate(910, 55)">
    <rect x="0" y="0" width="200" height="65" rx="8" fill="none" stroke="#1e3a8a" stroke-width="1" opacity="0.5"/>
    <text x="15" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#64748b">技术栈</text>
    <text x="15" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#818cf8">Python · FastAPI · Streamlit</text>
    <text x="15" y="54" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6366f1">Pandas · Plotly · Pydantic</text>
  </g>

  <!-- Decorative chart element -->
  <g transform="translate(910, 145)" opacity="0.2">
    <rect x="0" y="15" width="25" height="45" rx="2" fill="#4ade80"/>
    <rect x="30" y="10" width="25" height="50" rx="2" fill="#fbbf24"/>
    <rect x="60" y="5" width="25" height="55" rx="2" fill="#f87171"/>
    <rect x="90" y="20" width="25" height="40" rx="2" fill="#60a5fa"/>
    <rect x="120" y="12" width="25" height="48" rx="2" fill="#4ade80"/>
    <rect x="150" y="8" width="25" height="52" rx="2" fill="#a78bfa"/>
    <rect x="180" y="25" width="25" height="35" rx="2" fill="#22d3ee"/>
    <rect x="210" y="18" width="25" height="42" rx="2" fill="#4ade80"/>
  </g>

  <!-- Bottom decorative bar -->
  <rect x="0" y="293" width="1200" height="7" fill="#4ade80" opacity="0.15"/>

  <!-- Version -->
  <text x="1150" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="10"
        fill="#2d3748" text-anchor="end">v1.0.0</text>
</svg>
